# =============================================================================
#  Plataforma Atlas — configuración de reverse proxy para el Nginx de BISA
# =============================================================================
#  Sirve para los DOS ambientes (los server blocks son idénticos; solo cambia <IP_APPS>):
#    - PRODUCCIÓN: lo instala BISA en su host de Nginx separado. <IP_APPS> = IP interna
#      del servidor de aplicaciones. TLS/certificados los opera BISA.
#    - STAGING: se instala en el MISMO servidor de apps (Nginx local). <IP_APPS> = 127.0.0.1.
#      Copiar a /etc/nginx/conf.d/atlas.conf y ejecutar setsebool -P httpd_can_network_connect on.
#  En ambos casos el servidor de aplicaciones (Docker) NO sirve TLS: expone los contenedores
#  y este Nginx (de BISA o local) los publica terminando TLS.
#
#  QUÉ REEMPLAZAR (buscar/reemplazar en todo el archivo):
#    <IP_APPS>     → IP interna del servidor de aplicaciones (donde corre Docker)
#    <DOMINIO>     → dominio definitivo de Atlas (p. ej. atlas.bisaseguros.com)
#    <RUTA_CERT>   → ruta al certificado + cadena intermedia (fullchain) en este host
#    <RUTA_KEY>    → ruta a la llave privada en este host
#
#  PUERTOS EN EL SERVIDOR DE APPS:
#    8080 = backend-api   |   4201 = agentes   |   4202 = backoffice   |   4203 = clientes
#
#  REQUISITOS DE RED / SEGURIDAD:
#    - Este host debe alcanzar <IP_APPS> en 8080/4201/4202/4203 (red interna).
#    - En el servidor de apps, la cadena iptables DOCKER-USER debe permitir la IP
#      de ESTE proxy hacia esos puertos y rechazar el resto.
#    - Si este host es RHEL con SELinux: setsebool -P httpd_can_network_connect on
#
#  El certificado debe incluir la CADENA INTERMEDIA de la CA corporativa, o
#  algunos clientes (Android/iOS) rechazarán la conexión. Un wildcard
#  *.<DOMINIO> cubre los 4 subdominios.
#
#  Instalar (ejemplo RHEL): copiar a /etc/nginx/conf.d/atlas.conf
#  Validar y recargar:      nginx -t && systemctl reload nginx
#
#  COMPATIBILIDAD: la directiva "http2 on;" requiere Nginx >= 1.25.1. Si BISA usa
#  una versión anterior, reemplazar en cada block:
#      listen 443 ssl;   +   http2 on;      →      listen 443 ssl http2;
# =============================================================================


# --- Ajustes TLS y cabeceras comunes -----------------------------------------
# (Se repiten en cada server block por claridad. Si BISA prefiere, puede mover
#  estas líneas a un snippet e incluirlo con:  include /etc/nginx/atlas-ssl.conf; )


# =============================================================================
#  1) API  →  backend-api (:8080)
#     Consumido por apps móviles, por las webs (CORS) y sirve los deep links.
# =============================================================================
server {
    listen 80;
    server_name api.<DOMINIO>;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name api.<DOMINIO>;

    ssl_certificate     <RUTA_CERT>;
    ssl_certificate_key <RUTA_KEY>;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;

    client_max_body_size 10M;      # coincide con MAX_FILE_SIZE del backend

    # Deep links Android/iOS: los sirve el contenedor clientes-web (:4203)
    location /.well-known/ {
        proxy_pass http://<IP_APPS>:4203;
        proxy_set_header Host $host;
    }

    location = /actuator/health {
        proxy_pass http://<IP_APPS>:8080/actuator/health;
        access_log off;
    }

    location / {
        proxy_pass http://<IP_APPS>:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # imprescindible: TLS termina aquí
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ~ /\. { deny all; access_log off; log_not_found off; }
}


